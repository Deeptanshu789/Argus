# Argus — full stack.
#
#   docker compose up -d db redis     # usual dev mode; app runs on the host
#   docker compose up -d              # everything, for the demo machine
#
# `app` is the Next.js custom server: UI, /api route handlers, and the /ws
# upgrade in one process. `worker` supervises the Python inference sidecars —
# the only place Python runs at runtime — and is separate on purpose: decoding
# video pins a CPU core and would stall the dashboard if it shared a process.

services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus
      POSTGRES_DB: argus
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  app:
    image: node:22-slim
    working_dir: /app
    environment:
      DATABASE_URL: postgresql://argus:argus@db:5432/argus
      REDIS_URL: redis://redis:6379/0
      PORT: "3000"
    ports: ["3000:3000"]
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: sh -c "npm ci && npm run build && npm start"

  # Node supervisor + Python sidecars share this container: the supervisor
  # spawns `python ml/sidecar.py` as a child process, so they must co-locate.
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://argus:argus@db:5432/argus
      REDIS_URL: redis://redis:6379/0
      ARGUS_PYTHON: python3
      ARGUS_CAMERAS: CAM1=demo/cam1.mp4,CAM2=demo/cam2.mp4,CAM3=demo/cam3.mp4,CAM4=demo/cam4.mp4
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      app: { condition: service_started }
    command: npm run worker

volumes:
  pgdata:
  node_modules:
